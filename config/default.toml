# The Default configuration.
#
# The control plane seeds its Config file from this file on first run and
# loads the result. Edit the seeded file, not this one: the seed is a copy,
# and every new machine starts from this template again.
#
# This file is meant to be extended:
#   - The states and the task types' transitions are the workflow machine
#     (ADR 0027). Add your own states, task types, and transition branches.
#   - The [[sources]] example below is the one block you uncomment and edit
#     to add a repository feed.
#   - The consult Consultation type passes your input straight through to
#     the agent, so you can start one without configuring.
#
# The plane owns the workflow labels (ADR 0027). A ticket's position is the
# first state whose match holds on it, re-derived on every refresh. When a
# task completes, the plane fires that task type's transition: it writes the
# label facts on the ticket and its linked pull request, and the machine
# re-derives every position from the written labels. The agents never write
# workflow labels.

default-agent = "pi"
default-environment = "worktree"
default-task-type = "implement"
attention-bell = true
interaction-exit-key = "f12"
auto-handoff = false
max-parallel-agents = 2
agent-poll-interval-seconds = 5
completion-message-lines = 200
max-handoffs-per-ticket = 20

[scroll]
speed = 1
acceleration = 0.8
maximum-speed = 6

# --- Priority -------------------------------------------------------------
# An ordered list of labels that ranks tickets: the first entry is the
# highest rank. A ticket that carries one of these labels ranks by it. The
# operator bumps a rank from the ticket detail, and a bump beats the label.
# An "off" bump sets the ticket unranked. Omitted: tickets are not ranked
# and the list keeps its previous order.
#
# [priority]
# labels = ["critical", "high", "low"]

[agents.pi]
kind = "pi"
model = "--model {value}"
thinking = "--thinking {value}"
thinking-values = ["off", "minimal", "low", "medium", "high", "xhigh", "max"]

[agents.codex]
kind = "codex"
model = "--model {value}"
thinking = "-c model_reasoning_effort={value}"
thinking-values = ["minimal", "low", "medium", "high"]
context-window = "-c model_context_window={value}"

[agents.claude]
kind = "claude"
model = "--model {value}"
thinking = "--effort {value}"
thinking-values = ["low", "medium", "high", "xhigh", "max"]
context-window = "--autocompact {value}"

[consultation-types.consult]
agent = "pi"
environment = "live-worktree"
template = "{input}"

# --- The workflow machine (ADR 0027) --------------------------------------
# The four states of the label workflow. A state's match names the labels
# that put a ticket on it; its task is what the plane suggests for a ticket
# that sits there. Order decides: the first matching state wins.

[[states]]
name = "ready-for-agent"
task-type = "implement"
[states.match]
source-kind = "github-issue"
labels-any = ["ready-for-agent"]

[[states]]
name = "needs-work"
task-type = "rework"
[states.match]
source-kind = "github-pull-request"
labels-any = ["needs-work"]

[[states]]
name = "ready-for-review"
task-type = "review"
[states.match]
source-kind = "github-pull-request"
labels-any = ["ready-for-review"]

[[states]]
name = "ready-to-ship"
task-type = "merge"
[states.match]
source-kind = "github-pull-request"
labels-any = ["ready-to-ship"]

# --- The task types --------------------------------------------------------
# Each task type is work only: a prompt template and a task profile. The
# transition hangs off the type that completes it and writes the label facts
# the machine then reads. The templates carry no label instructions: the
# plane owns the labels.

[task-types.implement]
template = '''
Implement the following {source-kind}. 

### Instructions

1. **Develop Code**
   - Implement all acceptance criteria on this branch.
   - Commit all changes to this branch.

2. **Create Pull Request**
   - Open a new Pull Request.
   - Link the pull request to the ticket. Successfully merging this pull request may close these issues.
   - List any technical choices made when specifications were not clear.

Repository: {repository}

{external-key}: {title}

URL: {source-url}

Labels: {labels}

Description:
{description}'''
[task-types.implement.transition]
ticket-facts = []
pull-request-facts = ["ready-for-review"]

[task-types.review]
template = '''
Review pull request {external-key}: {title}.

### Rules
1. **Verify Specification**
   - Check if the code satisfies all acceptance criteria in the ticket.
   - List missing requirements or incorrect behavior.

2. **Assess Code Quality**
   - Check design, modularity, readability, and testing standards.
   - List maintainability, security, or performance issues.

3. **Calculate Score**
   - Give a total score from 0 to 100 based on both areas.

### Output Format

- **Score:** [0-100] / 100
- **Specification Check:** [Pass/Fail - Details]
- **Quality Check:** [Pass/Fail - Details]
- **Required Changes:** [Bullet points]

### Outcome
- Post the output as a comment on the pull request.

Repository: {repository}
Pull request: {source-url}

Labels: {labels}

Description:
{description}'''
[task-types.review.transition]
ticket-facts = []
pull-request-facts = []
score-threshold = 90
[[task-types.review.transition.branches]]
when = "score-above-threshold"
pull-request-facts = ["ready-to-ship"]
[[task-types.review.transition.branches]]
when = "score-below-threshold"
pull-request-facts = ["needs-work"]

[task-types.rework]
template = '''
Rework pull request {external-key}: {title}.

### Instructions

1. **Read Comments**
   - Read last review comments.

2. **Make Changes**
   - Correct the code according to the review comments.

3. **Update Repository**
   - Commit and push changes to this branch.

4. **Update Pull Request**
   - Write a summary of your changes in a new comment.

Repository: {repository}
Pull request: {source-url}

Labels: {labels}

Description:
{description}'''
[task-types.rework.transition]
ticket-facts = []
pull-request-facts = ["ready-for-review"]

[task-types.merge]
thinking = "low"
template = '''
Merge pull request {external-key}: {title}.

### Instructions

1. **Squash and Merge**
   - Squash and merge the pull request into its base branch.
   - Close the related ticket if all acceptance criteria are satisfied.

2. **On a Blocked Merge**
   - If the pull request has a merge conflict or a failing CI check, do not merge.
   - Post a comment explaining the reason for the blocked merge.

Repository: {repository}
Pull request: {source-url}

Labels: {labels}

Description:
{description}'''
[task-types.merge.transition]
ticket-facts = []
pull-request-facts = []
[[task-types.merge.transition.branches]]
when = "pull-request-open"
pull-request-facts = ["needs-work"]
[[task-types.merge.transition.branches]]
pull-request-facts = []

# --- Ticket sources -------------------------------------------------------
# No source is active out of the box, so the control plane starts with an
# empty ticket list on any machine. Add one block per feed: uncomment the
# example and name your repositories. The issue feed lists open issues
# without pre-labeling: the plane runs in auto mode on whatever it finds.

# [[sources]]
# name = "my-issues"
# kind = "github-issues"
# refresh-interval-seconds = 60
# repositories = ["owner/name"]
# host = "github.com"
