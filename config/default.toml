# The Default configuration.
#
# The control plane seeds its Config file from this file on first run and
# loads the result. Edit the seeded file, not this one: the seed is a copy,
# and every new machine starts from this template again.
#
# This file is meant to be extended:
#   - The states and the task types' transitions are the workflow machine
#     (ADR 0027). Add your own states, task types, and transition branches.
#   - The [[sources]] example below is the one block you uncomment and edit
#     to add a repository feed.
#   - The consult Consultation type passes your input straight through to
#     the agent, so you can start one without configuring.
#   - The pair Consultation type starts a pair programming session: the
#     agent drives the code, and the operator steers the work and runs the
#     tests.
#
# The plane owns the workflow labels (ADR 0027). A ticket's position is the
# first state whose match holds on it, re-derived on every refresh. When a
# task completes, the plane fires that task type's transition: it writes the
# label facts on the ticket and its linked pull request, and the machine
# re-derives every position from the written labels. The agents never write
# the labels the machine writes: the sanctioned exceptions are the settling
# agents of the two operator-decides types, which apply only the
# operator-owned labels their own templates name (ADR 0086) - the analyze
# agent applies ready-for-agent, and spec:<number> on a locked ticket, and the
# diagnose agent applies needs-info on the skill's honest stop.

default-agent = "pi"
default-environment = "worktree"
default-task-type = "implement"
attention-bell = true
desktop-notification = true
interaction-exit-key = "f12"
max-parallel-agents = 2
agent-poll-interval-seconds = 5
completion-message-lines = 200
max-handoffs-per-ticket = 20

[scroll]
speed = 1
acceleration = 0.8
maximum-speed = 6

# --- Logging ---------------------------------------------------------------
# The plane's own file log. The TUI owns the terminal, so the run's record
# lives in a file the operator reads later. Delete the table: the run writes
# no log.
[logging]
level = "info"
# file = "factory.log"   # Relative paths use this config's directory; unset
                         # puts the log next to the state file.
max-size-mib = 10
keep = 5

[agents.pi]
kind = "pi"
model = "--model {value}"
thinking = "--thinking {value}"
thinking-values = ["off", "minimal", "low", "medium", "high", "xhigh", "max"]

[agents.codex]
kind = "codex"
model = "--model {value}"
thinking = "-c model_reasoning_effort={value}"
thinking-values = ["minimal", "low", "medium", "high"]
context-window = "-c model_context_window={value}"

[agents.claude]
kind = "claude"
model = "--model {value}"
thinking = "--effort {value}"
thinking-values = ["low", "medium", "high", "xhigh", "max"]
context-window = "--autocompact {value}"

[consultation-types.consult]
agent = "pi"
template = "{input}"

# The diagnose Consultation type runs the bug-diagnosis loop by hand (issue
# #330): the operator picks the type in the launcher, names a Repository, and
# types the bug report as the input. The worktree environment is the skill's
# own first rule - a deterministic, isolated loop. An operator who needs their
# live checkout sets the Environment in the launcher for that one start.
# The agents need the diagnosing-bugs skill for it: without the skill the
# Consultation opens on a slash command the agent does not know.
[consultation-types.diagnose]
agent = "pi"
environment = "worktree"
thinking = "xhigh"
template = '''/skill:diagnosing-bugs

The operator's words are the bug report for this session: they stand in for a ticket, and this branch is the work surface. Your final message is the report the operator reads.

### Rules

1. Build the feedback loop before any theory: one command, already run at least once, red-capable, deterministic, fast, and runnable unattended. No red-capable command, no hypothesis.
2. Reproduce the report's exact symptom, then minimise the repro until every remaining element is load-bearing.
3. Rank three to five falsifiable hypotheses and show the list before you test any of them.
4. Instrument against those predictions, one variable at a time. Tag every debug log with one prefix, and keep it tagged.
5. When no red-capable loop stands, stop and name what is needed from the operator: the environment access or the captured artifact. End the turn.
6. Write the regression test before the fix, at a seam that exercises the real bug pattern. Where no correct seam exists, state that as the finding.
7. Commit any fix, with its test, on this branch. Never push, never open a pull request, and never touch the default branch.
8. Remove the tagged instrumentation and the throwaway harness before the turn ends.
9. End each turn with the loop command, its verdict, the hypothesis that proved correct, and what the operator must check. The operator closes the session.

{input}'''

[consultation-types.pair]
agent = "pi"
thinking = "xhigh"
template = '''
You are the driver in a pair programming session. The operator is the navigator: they set the direction, give feedback, and run the real-life tests. You write the code and verify what you can.

### Rules

1. **Ground Yourself**
   - Read the repository's agent instructions (AGENTS.md or README) before your first change.
   - Find the project's own test, lint, and build commands.

2. **Work in Slices**
   - Implement one slice per turn. The goal is a fast loop: small steps, quick checks, the operator's feedback on real behavior.
   - Stop the turn when the slice is done, when you cannot verify the next step yourself, or when a choice belongs to the operator.
   - When the direction is unclear, ask one question and stop the turn. Never guess a requirement the operator did not state.

3. **Check Each Slice Against the Baseline**
   - The baseline for every slice: the code compiles, and the part you touched works. Check both before you end the turn.
   - Test-driven work is welcome: write the test for the slice, then the code that passes it.
   - Do not run the full test suite, the linter, or the CI gates on every turn. The slow gates wait for wrap-up.
   - Claim a check passed only when you ran it and it passed.

4. **Wrap Up on the Operator's Word**
   - When the operator says the work is ready to wrap up, close every gate green: the full test suite, the linter, the type checks, and the project's build.
   - Fix each failure before you report the wrap-up done.
   - Say which gates you ran and what each one returned.

5. **Hand Off Real-Life Tests**
   - A real-life test needs a human: a UI check, a real device, or the operator's desktop.
   - Give the exact steps: the working directory, the commands, and what to look for.
   - Stop the turn and wait for the operator's report.
   - Never claim a human test passed.
   - Never try to operate the operator's desktop.

6. **Commit Your Slices**
   - When the checkout sits on the default branch, make a working branch first and commit there.
   - Commit each finished slice to this branch.
   - Commit only the files you touched. Never use `git add -A`.

7. **End Every Turn Clearly**
   - End with what you did, what you verified and how, and what you need from the operator: a question, or the exact steps of a real-life test.

8. **Stay Inside the Limits**
   - Never push, never merge, and never open a pull request unless the operator asks.
   - On an ask, push this branch and open the pull request.
   - When the work is done, say what you did, where the work lives, and what is left.
   - The operator closes the session. You never close it.

### First instruction

{input}'''

# --- The workflow machine (ADR 0027) --------------------------------------
# The states of the label workflow. A state's match names the labels
# that put a ticket on it; its task is what the plane suggests for a ticket
# that sits there. Order decides: the first matching state wins.
#
# The transitions write `ready-for-review`, `ready-to-ship`, and
# `needs-work` on pull requests, and a write that names a label the
# repository does not have fails. Create the labels a transition writes
# in the repository before a fire can succeed: `gh label create
# <name> --repo <owner>/<name>`, or the repository's labels page.
#
# A label a state match names but no transition writes, such as
# `ready-for-agent` above, is yours: the plane's fire leaves it alone, so a
# state may gate on a scoping label the machine never touches.

[[states]]
name = "ready-for-agent"
task-type = "implement"
[states.match]
source-kind = "github-issue"
labels-any = ["ready-for-agent"]

# The analyze position (ADR 0085, ADR 0086): an agreed ticket that needs a
# specification before the work is worth implementing. It sits after the
# ready-for-agent state, so a ticket carrying both labels rests at
# ready-for-agent and is offered for implementation, not re-specified. The
# `ready-for-spec` label is operator-owned: no transition writes it, so no fire
# adds or removes it. The Repository init creates it and registers an issues
# feed on `label:ready-for-spec`, because GitHub search cannot union two label
# qualifiers in one query (ADR 0115). The analyze type carries operator-decides,
# so auto-handoff mode never starts the interview by itself (ADR 0117). Your
# agents need the grill-with-docs skill for the analyze type below.
[[states]]
name = "ready-for-spec"
task-type = "analyze"
[states.match]
source-kind = "github-issue"
labels-any = ["ready-for-spec"]

# The diagnosis position (ADR 0116): an open issue the repository's own triage
# has labelled a bug. It sits after the ready-for-agent and ready-for-spec
# states, so a ticket carrying either stronger operator label rests there and
# is never offered a diagnosis: the state order carries the precedence. The
# bug label is operator-owned: no transition writes it. The Repository init
# creates it and registers an issues feed on label:bug, because GitHub search
# cannot union two label qualifiers in one query (ADR 0115). The diagnose type
# carries operator-decides, so Auto-handoff mode never starts the diagnosis by
# itself (ADR 0117).
[[states]]
name = "bug"
task-type = "diagnose"
[states.match]
source-kind = "github-issue"
labels-any = ["bug"]

[[states]]
name = "needs-work"
task-type = "rework"
[states.match]
source-kind = "github-pull-request"
labels-any = ["needs-work"]

[[states]]
name = "ready-for-review"
task-type = "review"
[states.match]
source-kind = "github-pull-request"
labels-any = ["ready-for-review"]

[[states]]
name = "ready-to-ship"
task-type = "merge"
[states.match]
source-kind = "github-pull-request"
labels-any = ["ready-to-ship"]

# The security feeds: one state per source kind, matching without a label
# condition. The severity label is ranking data, not a gate. A finding that
# its task completes rests on the same-type hold while the item still lists
# upstream, the way a closed issue rests off the issue list.
[[states]]
name = "security-advisory"
task-type = "resolve-security-advisory"
[states.match]
source-kind = "github-security-advisory"

[[states]]
name = "security-dependabot-alert"
task-type = "resolve-dependabot-alert"
[states.match]
source-kind = "github-dependabot-alert"

[[states]]
name = "security-secret-alert"
task-type = "resolve-secret-scanning-alert"
[states.match]
source-kind = "github-secret-scanning-alert"

# A pull request the plane has not put in the machine parks: the plane offers
# no task for it, so it hands off nothing, and a label write is the only
# engine that moves it. That holds a stranger's pull request, and one an agent
# opened but has not finished with, out of the queue; the implement transition
# still reaches such a pull request as its ticket's linked pull request and
# labels it from there. It sits last because the states match in order.
[[states]]
name = "pull-request-unlabeled"
[states.match]
source-kind = "github-pull-request"
labels-none = ["needs-work", "ready-for-review", "ready-to-ship"]

# --- The task types --------------------------------------------------------
# Each task type carries exactly one form (ADR 0068): the prompt form, a
# prompt template and a task profile, or the action form, the plane action it
# resolves on and the method that action runs with. The transition hangs off
# the type that completes it and writes the label facts the machine then
# reads. The agents never write the labels the machine writes: the sanctioned
# exceptions are the settling agents of the two operator-decides types, which
# apply only the operator-owned labels their own templates name (ADR 0086) -
# the analyze agent applies ready-for-agent, and spec:<number> on a locked
# ticket, and the diagnose agent applies needs-info on the skill's honest
# stop.
#
# The pull request open (ADR 0076): a task type that opens a pull request
# carries `opens-pull-request = true`. At the Handoff start, before the
# agent's first commit, the plane pushes the ticket's factory branch and
# opens the pull request on it as a draft; the `{pull-request-url}` in its
# template is the url of the pull request that stands. The agent commits and
# pushes and never creates or merges a pull request. A task type without the
# fact works the branch as before, and the live worktree refuses the open.

[task-types.implement]
opens-pull-request = true
template = '''
Implement the following {source-kind}. 

### Instructions

1. **Read the Specification**
   - When the ticket's labels carry a `spec:<number>` label, read that issue first: it is the ticket's specification.

2. **Develop Code**
   - Implement all acceptance criteria on this branch.
   - Commit all changes to this branch.

3. **Work the Pull Request**
   - The pull request already stands at the url below, opened as a draft on this branch. It links the ticket; merging it closes the issue.
   - Commit and push your work to this branch. The pull request carries the commits you push.
   - List any technical choices made when specifications were not clear.
   - Post your notes as a comment on the pull request.
   - Never create or merge a pull request, and never edit its title or body: the machine owns it.

Repository: {repository}

{external-key}: {title}

URL: {source-url}

Pull request: {pull-request-url}

Labels: {labels}

Description:
{description}'''

[task-types.implement.transition]
ticket-facts = []
pull-request-facts = ["ready-for-review"]

[task-types.review]
template = '''
Review pull request {external-key}: {title}.

### Rules
1. **Verify Specification**
   - Check if the code satisfies all acceptance criteria in the ticket.
   - List missing requirements or incorrect behavior.

2. **Assess Code Quality**
   - Check design, modularity, readability, and testing standards.
   - List maintainability, security, or performance issues.

3. **Calculate Score**
   - Give a total score from 0 to 100 based on both areas.

### Output Format

- **Score:** [0-100] / 100
- **Specification Check:** [Pass/Fail - Details]
- **Quality Check:** [Pass/Fail - Details]
- **Required Changes:** [Bullet points]

### Outcome
- Post the output on the pull request, as a comment or a review.

Repository: {repository}
Pull request: {source-url}

Labels: {labels}

Description:
{description}'''
[task-types.review.transition]
ticket-facts = []
pull-request-facts = []
score-threshold = 90
[[task-types.review.transition.branches]]
when = "score-above-threshold"
pull-request-facts = ["ready-to-ship"]
[[task-types.review.transition.branches]]
when = "score-below-threshold"
pull-request-facts = ["needs-work"]

[task-types.rework]
template = '''
Rework pull request {external-key}: {title}.

### Review verdict

{review-verdict}

### Instructions

1. **Make Changes**
   - Correct the code according to the verdict above.
   - When the verdict section carries no verdict, read the pull request's last review comments yourself.

2. **Update Repository**
   - Commit and push changes to this branch.

3. **Update Pull Request**
   - Write a summary of your changes in a new comment.

Repository: {repository}
Pull request: {source-url}

Labels: {labels}

Description:
{description}'''
[task-types.rework.transition]
ticket-facts = []
pull-request-facts = ["ready-for-review"]

# The merge is a plane action (ADR 0068): the plane runs it through the
# command runner, with no agent and no worktree. The action form takes no
# prompt template and no profile keys; the method is the flag the action
# runs with, and the transition is the outcome's fire: it writes
# `needs-work` on the pull request the merge blocked, and no fact on the
# one that merged.
[task-types.merge]
action = "merge-pull-request"
method = "squash"
[task-types.merge.transition]
ticket-facts = []
pull-request-facts = []
[[task-types.merge.transition.branches]]
when = "pull-request-open"
pull-request-facts = ["needs-work"]
[[task-types.merge.transition.branches]]
pull-request-facts = []

# The analyze is the ticket-driven grilling (ADR 0085, ADR 0086): the agent
# grills the ticket's design with the operator in the live session, writes
# the specification back into the ticket body, commits the glossary entries
# and ADRs the interview produced directly to the default branch, and marks
# the ticket ready-for-agent. It carries no transition and no pull request:
# the branch stands for the implementation that follows. The operator-decides
# flag parks its completions for the operator, so unattended mode keeps the
# live session alive between the agent's questions and the operator's
# answers, and the same flag keeps unattended mode from starting the interview
# at all: the operator opens it, and the ticket keeps its row and its badge
# until they do (ADR 0117). Your agents need the grill-with-docs skill for it:
# without the skill the analyze handoff opens on a slash command the agent does
# not know.

[task-types.analyze]
thinking = "xhigh"
operator-decides = true
template = '''
/skill:grill-with-docs

You are grilling the specification of a ticket into a design the factory can implement. The interview runs in this live session: the operator answers your questions here, in this terminal, and your session continues when they do.

### The ticket

{external-key}: {title}

URL: {source-url}

Labels: {labels}

Description:
{description}

### Rules

1. **Ground Yourself**
   - Read the repository's agent instructions and its domain docs (GLOSSARY.md and the ADRs) before your first question.
   - Read the ticket in full, comments included, so the agreement behind it stands behind your questions.

2. **Work the Design Tree**
   - Every decision branches into the decisions that hang off it. Ask your whole open frontier in one turn, numbered, each question with your recommended answer.
   - Finding facts is yours, never the operator's: read the code, the docs, and the source before you ask.
   - When the frontier is empty, the design is settled. Never settle it on a guess.

3. **Keep the Session Alive**
   - End a turn only to ask the operator a question or to report the settled design. The operator answers here, and your session continues.
   - Never post the interview to the ticket. This terminal is the record.

4. **Write the Docs as the Design Settles**
   - When a term resolves, update the repository's glossary (GLOSSARY.md) right there.
   - When a decision is hard to reverse, surprising without context, and the result of a real trade-off, write an ADR.
   - Commit the documentation directly to the repository's default branch: fetch the default branch in this checkout, take a short-lived local branch from it, commit the docs there, push it to the default branch, return to the ticket's branch, and discard the short-lived branch.
   - Never push anything else to the default branch, never push the ticket's branch, and never create or merge a pull request: the branch stands for the implementation that follows.

5. **Land the Spec on the Ticket**
   - When the design is settled, rewrite the ticket's body into the specification: the context, the decisions with their reasons, and the acceptance criteria.
   - Keep the original request text, quoted, inside the new body.
   - Update the body through gh. When the body cannot be edited, open a new issue in the same repository titled "Spec: <ticket title>" with the full specification and a link to the ticket, apply a spec:<new issue number> label to the ticket, and say so in your final message.

6. **Mark the Ticket Ready**
   - When - and only when - the specification is settled and the docs are committed, apply the ready-for-agent label to the ticket through gh.
   - In your final message, say the specification is settled, that you applied ready-for-agent, and that the cycle is ready to close: the implementation starts from the ticket's new position.

Repository: {repository}

Previous session message (empty on a first session): {previous-message}'''

# The diagnose runs the bug-diagnosis loop on the ticket's own context (issue
# #330): the plane opens the ticket's draft pull request at the Handoff start,
# the agent runs the skill on the ticket's factory branch, and the transition
# writes ready-for-review on the pull request, so the review, rework, and
# merge machine takes over unchanged (ADR 0116). A turn that settles with a
# head that carries no commit ahead of its base rests as the missing pull
# request, and the Same-type hold rests the ticket the fire published nothing
# on. The operator-decides flag parks its completions for the operator, so the
# environment stays alive between the skill's checkpoints and the operator's
# close (ADR 0085), and the same flag keeps Auto-handoff mode from starting
# the diagnosis by itself (ADR 0117). The type pins no agent and no
# environment, the way implement and analyze do. The one sanctioned label
# write is the skill's honest stop: the template names needs-info, and the
# agent applies only the operator-owned labels its template names (ADR 0086).
# Your agents need the diagnosing-bugs skill for it: without the skill the
# diagnose handoff opens on a slash command the agent does not know.

[task-types.diagnose]
thinking = "xhigh"
operator-decides = true
opens-pull-request = true
template = '''
/skill:diagnosing-bugs

Repository: {repository}

{external-key}: {title}

URL: {source-url}

Pull request: {pull-request-url}

Labels: {labels}

Description:
{description}

### Rules

1. **Ground Yourself**
   - Read the repository's agent instructions and its domain docs (GLOSSARY.md and the ADRs in the area) before your first command.
   - Read the ticket in full, comments included, so the report stands behind the loop.

2. **Redact Every Secret**
   - Redact every secret in anything you show: the loop's output, the debug logs, and your final message alike.

3. **Build the Loop Before Any Theory**
   - One command, already run at least once, red-capable, deterministic, fast, and runnable unattended. No red-capable command, no hypothesis.

4. **Reproduce and Minimise**
   - Reproduce the reporter's exact symptom, then minimise the repro until every remaining element is load-bearing.

5. **Rank the Hypotheses**
   - Rank three to five falsifiable hypotheses and show the list before you test any of them.

6. **Instrument Against the Predictions**
   - Test one variable at a time against the hypotheses' predictions. Tag every debug log with one prefix.

7. **Regression Test Before the Fix**
   - Write the regression test before the fix, at a seam that exercises the real bug pattern. Where no correct seam exists, state that as the finding.

8. **Commit the Fix and Push**
   - Commit the test and the fix to this branch and push: the pull request that already stands carries the commits you push.
   - State the hypothesis that proved correct in the fix commit's message.

9. **Post the Diagnosis Report**
   - Post a diagnosis report as a comment on the pull request: the loop command with its red and green verdicts, the ranked hypotheses, the one that proved correct, and the regression seam used or the seam that does not exist.

10. **Clean Up Before the Turn Ends**
   - Remove the tagged instrumentation and the throwaway harness before the turn ends.

11. **Stay Inside the Limits**
   - Never create, merge, or edit the pull request, and never close, resolve, or withdraw the ticket: the merge closes it.

12. **The Honest Stop**
   - When no red-capable loop stands: stop, list what was tried, name what is needed from the operator, apply the needs-info label to the ticket through gh, and end the turn. No other label, ever.

Previous session message (empty on a first session): {previous-message}'''
[task-types.diagnose.transition]
ticket-facts = []
pull-request-facts = ["ready-for-review"]

# --- Security task types ----------------------------------------------------
# One task type per security ticket source, a sibling of implement. Each one
# carries a template that resolves its kind of finding: verify the finding
# and make the fix on the branch the pull request the plane opened already
# stands on. From there the review, rework, and merge workflow takes over.
# The transition writes ready-for-review on the opened pull request; the Next
# step it derives is the review the labels put the pull request on. A turn
# that settled with a head that carries no commit ahead of its base rests as
# the missing pull request, and the completed task type rests the ticket while
# the item still lists upstream.

[task-types.resolve-security-advisory]
thinking = "high"
opens-pull-request = true
template = '''
Resolve the following security advisory {external-key}: {title}.

### Instructions

1. **Understand the Advisory**
   - Read the advisory in full: severity, CWEs, affected component, vulnerable range, patched version, CVSS score, and proof of concept.

2. **Verify the Report**
   - Confirm the vulnerable code exists in this repository and the vulnerable range applies to the code in use.
   - When the report is invalid or does not apply to this code, stop: open no pull request and explain in your final message exactly why.

3. **Design the Fix**
   - Make the smallest change that removes the root cause.
   - Follow the upstream fix where it fits this code.
   - Fix sibling call sites that carry the same flaw in the same pull request.

4. **Develop**
   - Implement the fix.
   - Add a regression test that fails on the vulnerable behavior and passes on the fix.

5. **Commit the Fix**
   - Commit all changes to this branch and push them: the pull request that already stands on this branch carries the commits you push. It links the source item by its URL.
   - Never create or merge a pull request, and never edit its title or body: the machine owns it.
   - Never close, resolve, or withdraw the source item: closing a finding is a maintainer decision made after the fix merges.

Repository: {repository}

{external-key}: {title}

URL: {source-url}

Pull request: {pull-request-url}

Labels: {labels}

Description:
{description}'''
[task-types.resolve-security-advisory.transition]
ticket-facts = []
pull-request-facts = ["ready-for-review"]

[task-types.resolve-dependabot-alert]
thinking = "high"
opens-pull-request = true
template = '''
Resolve the following Dependabot alert {external-key}: {title}.

### Instructions

1. **Read the Alert**
   - Note the package, the ecosystem, the manifest, the vulnerable range, and the first patched version.

2. **Verify the Alert**
   - Find the package at a vulnerable version in this repository.
   - A transitive dependency lands on the direct dependency or the lockfile; fix it there.

3. **Check for an Existing Pull Request**
   - If a pull request already fixes this alert, do not open a competing one; explain in your final message which pull request covers it.

4. **Upgrade**
   - Upgrade to the first patched version with the smallest change that leaves the vulnerable range.
   - On a major bump, apply the minimal breaking migration.
   - Update the lockfile with the project's package manager.
   - Run the test suite.
   - When no patched version exists, remove or replace the dependency and record the choice in a pull request comment.

5. **Commit the Fix**
   - Commit all changes to this branch and push them: the pull request that already stands on this branch carries the commits you push. It links the source item by its URL.
   - Never create or merge a pull request, and never edit its title or body: the machine owns it.
   - Never close, resolve, or withdraw the source item: closing a finding is a maintainer decision made after the fix merges.

Repository: {repository}

{external-key}: {title}

URL: {source-url}

Pull request: {pull-request-url}

Labels: {labels}

Description:
{description}'''
[task-types.resolve-dependabot-alert.transition]
ticket-facts = []
pull-request-facts = ["ready-for-review"]

[task-types.resolve-secret-scanning-alert]
thinking = "high"
opens-pull-request = true
template = '''
Resolve the following secret scanning alert {external-key}: {title}.

### Instructions

1. **Read the Alert**
   - Note the secret type, the file, the lines, and the commit.

2. **Rotate First**
   - Rotate the exposed credential from your environment when you can, and record in the pull request description exactly what was rotated.
   - When you cannot rotate it, state in the pull request description exactly which credential to rotate: the alert stays live until rotation, and a human finishes the fix.

3. **Remove the Secret**
   - Remove the secret from the current state of the code and replace it with the project's environment variable or secret store reference.
   - When the project has neither, introduce the smallest convention that fits.

4. **Find Every Copy**
   - Search the repository for every other copy of the secret and report each one in the pull request description.

5. **History**
   - Do not rewrite git history in the pull request.
   - Note in the pull request description that history must be purged after rotation, for example with git filter-repo.

6. **Never Print the Secret**
   - Never print the secret value in the pull request, in a comment, or in a test.

7. **Commit the Fix**
   - Commit all changes to this branch and push them: the pull request that already stands on this branch carries the commits you push. It links the source item by its URL.
   - Never create or merge a pull request, and never edit its title or body: the machine owns it.
   - Never close, resolve, or withdraw the source item: closing a finding is a maintainer decision made after the fix merges.

