# The test runner's options that hold for every `bun test` invocation in this
# repository, the `bun run test` script included.
#
# The theme isolation preloads into every test file: the test files share one
# worker's environment, and a file that leaves a theme variable behind (a
# `NO_COLOR` a no-color test set and did not delete) would otherwise stand
# for the worker's remaining files. The preload's `beforeEach` clears the
# theme environment and forgets the cached resolution before every test of
# every file, the way the isolation's own header states the contract. Files
# that boot the app import the same module through the shared harness, and
# the doubled hook clears twice, which changes nothing.
#
# The passive-flush preload patches the scheduler before any test file's
# imports can load React's reconciler, which takes the scheduler's schedule
# function at its own module init. It is inert until a test holds the
# passive flushes, the way the hold's own header states (issue #311).
#
# The plane-cleanup preload owns the hook that closes every plane the run's
# tests open, at the end of every test of every file. A module-scope hook
# inside the plane's own file binds to the one file that first imports it,
# and Bun evaluates a plain run's modules once, so the other files would leak
# the planes they open; the preload's hook belongs to no file and holds in
# every file, with or without `--isolate`.
[test]
preload = [
  "./test/theme-isolation.ts",
  "./test/passive-flush-hold.ts",
  "./test/plane-cleanup.ts",
]
