name: Release

on:
  push:
    tags: ["v*"]

# Trusted publishing: npm identifies this repository through the OIDC token
# it hands GitHub Actions. No npm token is stored anywhere.
permissions:
  contents: read
  id-token: write

jobs:
  # Every check the publish and the build share: a broken tree releases
  # neither a package nor a binary.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # Node stays for the publish itself and the tag check below: the build,
      # the checks, and the docs all run on Bun, but npm publish is the one
      # step only Node does.
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: bun install
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run docs:build
      - name: The tag must match the version both packages declare
        run: |
          tag="${GITHUB_REF_NAME#v}"
          main="$(node -p "require('./package.json').version")"
          alias="$(node -p "require('./packages/mlsf/package.json').version")"
          test "$tag" = "$main"
          test "$tag" = "$alias"
          echo "releasing $main"

  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: bun install
      # The main package first: the alias pins an exact version of it and
      # must find it in the registry.
      - name: Publish my-little-software-factory with provenance
        run: npm publish --provenance
      - name: Publish the mlsf alias with provenance
        run: npm publish --provenance --prefix packages/mlsf

  # One leg per target, each on a clean runner: the leg installs its own
  # operating system's and architecture's OpenTUI cores and no others. A Linux
  # leg gets both libc variants that way, because @opentui/core's loader names
  # six literal platform imports and the bundler resolves every one of them
  # whatever --target it is given. scripts/build-binary.ts says why, and
  # docs/verification/release.md records the core count and the byte size of
  # each target's artifact.
  build:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux-x64
          - linux-x64-musl
          - linux-arm64
          - linux-arm64-musl
          - darwin-x64
          - darwin-arm64
          - windows-x64
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # The optional platform cores stay out of the plain install: the build
      # adds the cores of its target, and the compile embeds what the install
      # placed.
      - run: bun install --omit=optional
      - run: bun run build ${{ matrix.target }} --out dist
      # The leg that builds the runner's own target runs the binary it just
      # built: a compile that produces an unrunnable file fails here.
      - name: The built binary answers --version on this runner
        if: matrix.target == 'linux-x64'
        run: |
          asset="$(ls dist/factory-*)"
          test "$(ls dist/factory-* | wc -l)" -eq 1
          "$asset" --version
      # The glibc runner cannot run the musl binary; an alpine container can.
      - name: The musl binary answers --version in an alpine container
        if: matrix.target == 'linux-x64-musl'
        run: |
          asset="$(ls dist/factory-*)"
          test "$(ls dist/factory-* | wc -l)" -eq 1
          # The OpenTUI musl core is linked against the GNU C++ runtime, which
          # the alpine base image does not carry: without libstdc++ the binary
          # dies on a relocation error before it answers anything. The
          # operator's musl machine needs the same package, and the
          # prerequisites name it.
          docker run --rm -v "$PWD/dist:/dist" -e BINARY="$(basename "$asset")" alpine:3.20 \
            sh -c 'apk add --no-cache libstdc++ >/dev/null && "/dist/$BINARY" --version'
      - uses: actions/upload-artifact@v7
        with:
          name: factory-${{ matrix.target }}
          path: dist/

  # The macOS leg runs on the runner the binary targets. The darwin-x64
  # binary and the arm64 linux binaries take no smoke: the record in
  # docs/verification/release.md names them as unverified on a runner.
  #
  # Every asset name in this job is the release's version as a wildcard over
  # the file the build writes. test/release-workflow.test.ts pins each one
  # against the shared assetFileName: this job is a third party to that name,
  # and a step that names a file the build never produces blocks the upload.
  smoke-darwin:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: factory-darwin-arm64
          path: dist
      # upload-artifact keeps no file modes: everything it stores comes back
      # 644, so the leg makes the file runnable before it asks it a question.
      # The installer sets its own mode, so the loss stops here.
      - name: The darwin-arm64 binary answers --version on macOS
        run: |
          asset="$(ls dist/factory-*-darwin-arm64)"
          test "$(ls dist/factory-*-darwin-arm64 | wc -l)" -eq 1
          chmod +x "$asset"
          "$asset" --version

  smoke-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: factory-windows-x64
          path: dist
      - name: The windows-x64 binary answers --version on Windows
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem -Path 'dist/factory-*-windows-x64.exe' -ErrorAction SilentlyContinue)
          if ($assets.Count -ne 1) {
            Write-Error "expected one windows-x64 asset in dist, found $($assets.Count)"
            exit 1
          }
          & $assets[0].FullName --version
          exit $LASTEXITCODE

  # The release carries every target and the checksums the installer
  # verifies against. It waits on the smoke jobs: a binary that does not run
  # on its own operating system is not uploaded. A missing target stops the
  # upload, and the npm installer degrades to its readable "incomplete
  # release" line until the leg is re-run.
  release:
    needs: [build, smoke-darwin, smoke-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: The release carries every target's binary and its checksums
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for dir in artifacts/factory-*/; do cp "$dir"factory-* dist/; done
          assets=()
          for t in linux-x64 linux-x64-musl linux-arm64 linux-arm64-musl darwin-x64 darwin-arm64 windows-x64; do
            case "$t" in
              windows-*) ext=".exe" ;;
              *) ext="" ;;
            esac
            file="dist/factory-${version}-${t}${ext}"
            if ! test -s "$file"; then
              echo "missing $file: the build leg for $t failed or uploaded nothing"
              exit 1
            fi
            assets+=("$file")
          done
          # The checksums file is the installer's first read on every platform:
          # a release that carries no sums file installs nothing anywhere. Each
          # line holds the bare asset name, the form `checksumMatches` looks up.
          sums="factory-${version}.sha256sums"
          (cd dist && sha256sum "factory-${version}-"* > "$sums")
          if ! test -s "dist/$sums"; then
            echo "missing dist/$sums: the installer cannot look up an asset it cannot name"
            exit 1
          fi
          # dist must hold exactly the seven assets and the one sums file. The
          # upload line's glob is wider than the checksum glob (`-` after the
          # version versus any separator), so a file that fits one and not the
          # other would ship unverified or be looked up by no installer.
          found=$(find dist -maxdepth 1 -type f | wc -l)
          if [ "$found" -ne $(( ${#assets[@]} + 1 )) ]; then
            echo "dist holds $found files; the release takes ${#assets[@]} assets and one sums file"
            find dist -maxdepth 1 -type f
            exit 1
          fi
          # Every asset the release uploads is named by the sums file, and every
          # line names a file that is there with the bytes it says.
          for file in "${assets[@]}"; do
            if ! grep -q "  ${file##dist/}$" "dist/$sums"; then
              echo "dist/$sums does not name ${file##dist/}: an install of that target stops at the checksum read"
              exit 1
            fi
          done
          (cd dist && sha256sum -c --strict "$sums")
          cat "dist/$sums"
      - name: Upload the binaries and the checksums to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Create the release only where it is missing: a re-run of this job
          # after the create step already ran has to complete the release, not
          # fail on the name it took. The upload is --clobber either way.
          if ! gh release view "v${version}" >/dev/null 2>&1; then
            gh release create "v${version}" \
              --title "v${version}" \
              --notes "The control plane v${version}.

          Install with \`npx mlsf\` (or \`npx my-little-software-factory\`): the package installs the prebuilt binary for your platform from this release and verifies it against \`factory-${version}.sha256sums\`. The binary needs neither Node nor Bun.

          Targets: linux-x64, linux-x64-musl, linux-arm64, linux-arm64-musl, darwin-x64, darwin-arm64, windows-x64."
          fi
          # One glob for both: `factory-<version>-*` names the seven binaries
          # and `factory-<version>.sha256sums` beside them, so the sums file the
          # installer fetches first is the same file the release job wrote.
          # `checksumFileName` and `assetFileName` share the `factory-<version>`
          # stem, and test/release-workflow.test.ts pins that this list covers
          # every asset name and the sums name alike.
          gh release upload "v${version}" dist/factory-"${version}"* --clobber
