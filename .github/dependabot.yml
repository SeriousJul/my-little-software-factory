version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Safe updates are auto-merged by the dependabot-auto-merge workflow once
    # CI (lint, typecheck, test) is green. Major version bumps arrive as PRs
    # and are held by the same workflow for manual review.
    # One weekly PR holding all patch and minor bumps.
    groups:
      all:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # PR-only. A major bump here is a major action version, which is
    # exactly what Dependabot is good at flagging, but a human merges it.
