version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Keep major version bumps manual. They can change runtime behavior.
    ignore:
      - dependency-name: "*"
        update-type: "version-upgrade: major"
    # One weekly PR holding all patch and minor bumps.
    groups:
      all:
        patterns:
          - "*"
    # Merge when CI (lint, typecheck, test) is green.
    auto-merge: true

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # PR-only. A major bump here is a major action version, which is
    # exactly what Dependabot is good at flagging, but a human merges it.
    auto-merge: false
